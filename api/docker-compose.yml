# Sobe só o PostgreSQL para desenvolvimento local:
#   docker compose up -d
#   psql "postgresql://ariano:ariano@localhost:5432/ariano" -f db/schema.sql
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ariano
      POSTGRES_PASSWORD: ariano
      POSTGRES_DB: ariano
    ports:
      - "5432:5432"
    volumes:
      - ariano_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ariano"]
      interval: 5s
      retries: 10

  api:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql://ariano:ariano@db:5432/ariano
      ARIANO_ENGINE_LIB: /app/Matching-ariano-c/matching_engine/build/libariano.so
    ports:
      - "${ARIANO_API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  ariano_pgdata:

